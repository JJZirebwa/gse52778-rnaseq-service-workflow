name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run validator tests
        run: python3 -m unittest discover -s tests -v

  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.6'
      - name: Build pinned analysis image
        run: docker build --tag gse52778-rnaseq-service-workflow:1.0.0 --file containers/Dockerfile .
      - name: First clean workflow run
        run: |
          mkdir -p results-run-1/nextflow
          nextflow run main.nf \
            -profile docker \
            -work-dir work-run-1 \
            --outdir results-run-1 \
            --git_commit "${GITHUB_SHA}" \
            -with-report results-run-1/nextflow/report.html \
            -with-timeline results-run-1/nextflow/timeline.html \
            -with-trace results-run-1/nextflow/trace.txt \
            -with-dag results-run-1/nextflow/dag.html
      - name: Second clean workflow run and determinism gate
        run: |
          mkdir -p results-run-2/nextflow
          nextflow run main.nf \
            -profile docker \
            -work-dir work-run-2 \
            --outdir results-run-2 \
            --git_commit "${GITHUB_SHA}" \
            -with-report results-run-2/nextflow/report.html \
            -with-timeline results-run-2/nextflow/timeline.html \
            -with-trace results-run-2/nextflow/trace.txt \
            -with-dag results-run-2/nextflow/dag.html
          first_hash="$(sha256sum results-run-1/handoff/full_results.csv | cut -d' ' -f1)"
          second_hash="$(sha256sum results-run-2/handoff/full_results.csv | cut -d' ' -f1)"
          test "${first_hash}" = "${second_hash}"
          printf 'primary_result_sha256=%s\n' "${first_hash}"
      - name: Upload handoff and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse52778-workflow-evidence
          path: |
            results-run-1/
            results-run-2/handoff/provenance_manifest.json
          if-no-files-found: warn
